# Configuration for candidates.py
# ダイナミクスの候補量ごとに、sparsity の影響をどれだけ捉え、Accuracy をどれだけ説明するかを、同じ図と同じ数値で比べる。
# 計算し直しはせず、保存済みの出力を run_dir で結合する。
defaults:
  - _self_
hydra:
  job:
    chdir: True

# 出力（results.json と図）は、実行ごとに Hydra が作るランディレクトリ outputs/<日付>/<時刻>/ に書く

# 入力。相対パスは元の作業ディレクトリから解決する。デフォルトは sweep200 (caracal + oncilla)
sparsity_path:
  - "data/2026-09-30_sweep200/caracal/sparsity.json"
  - "data/2026-09-30_sweep200/oncilla/sparsity.json"

accuracy_path:
  - "data/2026-09-30_sweep200/caracal/results.json"
  - "data/2026-09-30_sweep200/oncilla/results.json"

separation_path:
  - "data/2026-10-06-separation/caracal.npz"
  - "data/2026-10-06-separation/oncilla.npz"

dynamics_path:
  - "data/2026-10-11-rates/caracal.json"
  - "data/2026-10-11-rates/oncilla.json"

# Accuracy に使う readout の点数 k（readout_subset の results.json の中から選ぶ）
subset_size: 100
