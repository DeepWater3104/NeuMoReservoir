# Configuration for candidates.py
# ダイナミクスの候補量ごとに、sparsity の影響をどれだけ捉え、Accuracy をどれだけ説明するかを、同じ図と同じ数値で比べる。
# 計算し直しはせず、保存済みの出力を run_dir で結合する。
defaults:
  - _self_
hydra:
  job:
    chdir: True

# 出力（results.json と図）は、実行ごとに Hydra が作るランディレクトリ outputs/<日付>/<時刻>/ に書く

# 入力。相対パスは元の作業ディレクトリから解決する。デフォルトは sweep200 (caracal + oncilla)
sparsity_path:
  - "data/2026-09-30_sweep200/caracal/sparsity.json"
  - "data/2026-09-30_sweep200/oncilla/sparsity.json"

accuracy_path:
  - "data/2026-09-30_sweep200/caracal/results.json"
  - "data/2026-09-30_sweep200/oncilla/results.json"

# dynamics.py mode=compute target=separation の summary.npz（リスト可）。SR に使う
separation_path:
  - "data/2026-10-06-separation/caracal.npz"
  - "data/2026-10-06-separation/oncilla.npz"

# dynamics.py mode=compute の JSON（リスト可）。rates.json、effective_rank.json、consistency.json を
# 何本でも並べてよい。run_dir で結合し、各ファイルにある項目だけを取り込む
dynamics_path:
  - "data/2026-10-11-rates/caracal.json"
  - "data/2026-10-11-rates/oncilla.json"

# Accuracy に使う readout の点数 k（readout_subset の results.json の中から選ぶ）
subset_size: 100

# 候補量の組。組ごとに、sparsity と組で Accuracy の R² を4つに分ける（候補量の名前は candidates.py の一覧と同じ）
combinations:
  - ["SR (Standardised)", "bAP Rate"]
  - ["SR (Standardised)", "dSpike Rate"]
  - ["SR (Standardised)", "bAP Rate", "dSpike Rate"]
  - ["bAP Consistency", "bAP Rate"]
  - ["bAP Consistency", "dSpike Rate"]
  - ["SR (Standardised)", "bAP Consistency"]
  - name: "All 10 (no soma rate)"
    members: ["SR", "SR (Standardised)", "bAP Rate", "dSpike Rate", "dSpike ER", "bAP ER", "bAP Rate x ER", "dSpike Rate x ER", "bAP Consistency", "dSpike Consistency"]
