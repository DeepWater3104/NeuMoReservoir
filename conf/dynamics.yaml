# Configuration for dynamics.py
# 生波形から実効ランク（Effective Rank）およびスパイク動態指標を算出する。
defaults:
  - _self_
hydra:
  job:
    chdir: True

# 対象のランのディレクトリ。グロブ可。相対パスは元の作業ディレクトリから解決する。
run_dir: null

# 出力（dynamics.json、events.npz、図）は、実行ごとに Hydra が作るランディレクトリ outputs/<日付>/<時刻>/ に書く

# compute: run_dir から算出して dynamics.json と events.npz を書く
# clusters: 保存済みの events.npz を読んで発火ごとの散布図を描く
mode: "compute"

# 計算パラメータ
window_ms: 5.0
v_threshold: -30.0
exclusion_window_ms: 10.0
test_only: true
n_jobs: 12
force: false

# clusters: compute が Hydra のランディレクトリに書いた events.npz を読み、
#           ランごとに R(All PCs) vs R(PC1 Excluded) を μ の順に並べて描く
events_path: null
# σ がこの値 [µm] 以下のランだけを描く（σ が大きいと μ の違いが薄まるため）
sigma_max: 100.0
n_cols: 6

# 同じ試行の中で、前の dSpike の検出からこの時間 [ms] 未満の検出は同じ1回の dSpike とみなす（最初の時刻を残す）。
# 1回の dSpike で隣り合う区画が少しずつずれた時間ステップに閾値を越え、別々に数えられるのを防ぐ。0 でまとめない
merge_ms: 2.0


