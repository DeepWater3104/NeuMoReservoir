# Configuration for dynamics.py
# 生波形から実効ランク（Effective Rank）およびスパイク動態指標を算出する。
defaults:
  - _self_
hydra:
  job:
    chdir: True

# 対象のランのディレクトリ。グロブ可。相対パスは元の作業ディレクトリから解決する。
run_dir: null

data_dir: "data"

# compute: run_dir から算出して dynamics.json を書く
# plot:    保存済みの dynamics.json, results.json, sparsity.json を読んで図を描く
# clusters: 保存済みの events.npz を読んで発火ごとの散布図を描く
mode: "compute"
dynamics_path: null
accuracy_path: null
sparsity_path: null
figure_dir: "figure"
output_path: null

# 計算パラメータ
window_ms: 5.0
v_threshold: -30.0
exclusion_window_ms: 10.0
test_only: true
n_jobs: 12
force: false

# clusters: compute が Hydra のランディレクトリに書いた events.npz を読み、
#           ランごとに R(All PCs) vs R(PC1 Excluded) を μ の順に並べて描く
events_path: null
# σ がこの値 [µm] 以下のランだけを描く（σ が大きいと μ の違いが薄まるため）
sigma_max: 100.0
n_cols: 6
