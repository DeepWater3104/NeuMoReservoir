# Configuration for memory_decay.py
# (how long the class of a trial stays readable once the window slides past it)
defaults:
  - _self_
hydra:
  job:
    chdir: True  # main.py と同様に outputs/YYYY-MM-DD/HH-MM-SS 以下へ出力する

# compute: ずらし幅ごとに readout を学習し直し、予測ラベルを memory_decay.npz に、
#          Accuracy(L) と半減時間を results.json に書く
# plot:    保存済みの memory_decay.npz を読んで図を描く（再計算しない）
mode: "compute"

# compute モード: main.py のランのディレクトリ（readout_subset.py と同じ指定の仕方）。
# 記録点の抽出の乱数種は seed + （このリストでの順番）なので、readout_subset.py と
# 同じ glob を渡すと、最初の num_draws 回はそちらと同じ記録点の組になる。
run_dir: null

# plot モード: compute モードが書いた memory_decay.npz のパス
decay_path: null

# 判定区間のずらし幅（ms）。0 から lag_max_ms まで lag_step_ms 刻み。
lag_step_ms: 5
lag_max_ms: 2000

# readout に使う記録地点の数と、引く組の数
subset_size: 100
num_draws: 100

# test 試行を分ける組の数。各クラスの test 試行数と同じでなければならない。
num_folds: 5

# 半減時間を決めない Accuracy(0) の上限（これ以下なら決めない）
min_initial_accuracy: 0.2

# 学習と L=0 の照合に使う抽出の数（fit_readout と重み・予測ラベルを突き合わせる）
check_draws: 2

# 並列実行数（スレッド。データを複製しないため）。-1 なら全コア。
n_jobs: -1

# 部分集合の抽出に使う乱数種（readout_subset.py と同じ値）
seed: 20260924

# null なら run の .hydra/config.yaml の reg（シミュレーション時の値）を使う
reg: null

figure_dir: "figure"
data_dir:   "data"
show: False
