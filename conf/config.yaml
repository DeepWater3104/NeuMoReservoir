# Default configurations for the reservoir simulation
defaults:
  - task: random
  - override hydra/launcher: joblib
  - _self_
hydra:
  job:
    chdir: True  # これをTrueにすると、プログラム実行中に自動でoutputs/...に移動します
  launcher: 
    n_jobs: 20  # ここを修正：launcherの下に配置する

# Shared parameters across different tasks and models
num_states: 100
reg: 1e-7
record_target: "calcium_acum" # Target variable for recording (e.g., potential, calcium_acum)
time_integration: True
seed: 1234                    # Random seed for reproducibility
exc_syn_tau1: 1               # Added: Required for synapse initialization
exc_syn_tau2: 5               # Added: Required for synapse initialization
# uniform: 膜面積に比例した重みでソーマ＋全樹状突起に配置（syn_loc_mean / syn_loc_std は未使用）
# gaussian / gaussian-apical / gaussian-basal: 面積 × ソーマからの距離のガウス重み
syn_loc_condition: "gaussian" # uniform or gaussian or gaussian-apical or gaussian-basal
syn_loc_mean: 600
syn_loc_std:  100

cell_name: "cell1/"

# 書き出すものを1箇所で決める。どのフラグもシミュレーションの内容には影響しない
# （乱数列を動かさない）ので、出力だけを変えて同じダイナミクスを再現できる。
output:
  confusion_matrix: true      # figure/confmat_*.png と data/classification_results.npz
  firing_rate: true           # data/firing_rate.txt
  flow_analysis_figure: true  # reservoir_flow_analysis.png（sinwave タスクのみ）

  # data/reservoir_states.npz。readout を任意の記録地点部分集合で学習し直すのに使う。
  # quantities に挙げた物理量それぞれを states_<物理量> として保存する。
  # time_integration が false のとき、中身はビンではなく各時間ステップの生サンプルになる
  # （行数が跳ね上がる点に注意）。
  reservoir_states: true
  reservoir_states_quantities: ["calcium", "potential"]

  # data/buffer*.npz と figure/buffer*.png。1試行あたり全時間ステップ × 全記録地点 ×
  # 2物理量の生トレースで、記録地点422点なら1試行約240 MB になる。reservoir_states の
  # 内容はここから導出できるが、こちらは桁違いに大きいので既定では書き出さない。
  buffers: false
  buffer_figures: false       # buffers が true のときだけ効く
  buffer_io_included: true    # バッファに target / output / 時間軸を含めるか

gcalbar_ratio: null
gcanbar_ratio: null
gcatbar_ratio: null
gcakbar_ratio: null
gslowcakbar_ratio: null
